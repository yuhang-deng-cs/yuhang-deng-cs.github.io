<html lang="en">
<head>
<meta charset="UTF-8">
<style>
  @font-face { font-family: "Inter"; font-weight: 400 700; src: url(../fonts/inter.woff2) format("woff2"); }
  @font-face { font-family: "JetBrains Mono"; font-weight: 400 800; src: url(../fonts/jbmono.woff2) format("woff2"); }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #fff; }
  body { font-family: "Inter", sans-serif; color: #0f172a; position: relative; }
  .grid { position: absolute; inset: 0; background-image: radial-gradient(#dbe4f3 1.2px, transparent 1.2px); background-size: 26px 26px; opacity: .7; }
  .glow { position: absolute; width: 620px; height: 620px; right: -120px; top: -140px; border-radius: 50%; background: radial-gradient(closest-side, rgba(37, 99, 235, .14), transparent); }
  .bar { position: absolute; left: 0; top: 0; bottom: 0; width: 12px; background: linear-gradient(180deg, #2563eb, #8b5cf6); }
  .left { position: absolute; left: 84px; top: 74px; width: 640px; }
  .brand { font: 700 24px "JetBrains Mono", monospace; color: #0f172a; }
  .brand b { color: #2563eb; }
  h1 { font: 800 92px/1 "JetBrains Mono", monospace; letter-spacing: -0.035em; margin-top: 54px; }
  .role { font: 700 34px/1.25 "JetBrains Mono", monospace; color: #2563eb; margin-top: 18px; letter-spacing: -0.01em; }
  .chips { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 40px; }
  .chip { font: 600 21px "Inter", sans-serif; padding: 10px 18px; border-radius: 999px; background: #eaf1ff; color: #1d4ed8; }
  .chip.ok { background: #e8f7ee; color: #15803d; }
  .chip.ok::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #16a34a; margin-right: 10px; vertical-align: 2px; }
  .url { position: absolute; left: 84px; bottom: 56px; font: 500 22px "JetBrains Mono", monospace; color: #64748b; }
  .photo { position: absolute; right: 92px; top: 78px; width: 348px; height: 435px; }
  .photo::before { content: ""; position: absolute; inset: 18px -18px -18px 18px; border: 3px dashed rgba(37, 99, 235, .45); border-radius: 30px; }
  .photo img { position: relative; width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; border-radius: 30px; box-shadow: 0 30px 60px -28px rgba(15, 23, 42, .5); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="bar"></div>
  <div class="left">

    <div class="chips">

      <span class="chip ok">Brisbane · Full work rights</span>
    </div>
  </div>
  <div class="url">yuhang-deng-cs.github.io</div>
  <div class="photo"><img src="../img/avatar-682.webp" alt=""></div>

</html>
