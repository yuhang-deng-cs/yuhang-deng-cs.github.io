<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — Yuhang Deng</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232563eb'/><text x='16' y='21.5' font-family='monospace' font-size='14' font-weight='700' fill='white' text-anchor='middle'>YD</text></svg>">
  <!-- Absolute paths: this page is served for any missing URL, at any depth -->
  <link rel="preload" href="/fonts/jbmono.woff2" as="font" type="font/woff2" crossorigin>
  <style>
    @font-face { font-family: "Inter"; font-weight: 400 700; font-display: swap; src: url(/fonts/inter.woff2) format("woff2"); }
    @font-face { font-family: "JetBrains Mono"; font-weight: 400 800; font-display: swap; src: url(/fonts/jbmono.woff2) format("woff2"); }
    :root { --text: #0f172a; --muted: #475569; --faint: #94a3b8; --line: #e2e8f0; --accent: #2563eb; color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: #fff radial-gradient(#e2e8f0 1.2px, transparent 1.2px) 0 0 / 26px 26px;
      color: var(--text); font: 16px/1.6 "Inter", -apple-system, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    main { text-align: center; max-width: 520px; }
    .code { font: 800 clamp(96px, 22vw, 160px)/1 "JetBrains Mono", ui-monospace, Consolas, monospace; letter-spacing: -0.04em; color: var(--accent); }
    .term { display: inline-block; margin: 20px 0 8px; padding: 8px 14px; border-radius: 10px; background: #0f172a; color: #e2e8f0; font: 500 14px "JetBrains Mono", ui-monospace, Consolas, monospace; text-align: left; }
    .term b { color: #f87171; font-weight: 500; }
    h1 { font: 700 26px/1.3 "JetBrains Mono", ui-monospace, Consolas, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif; margin: 18px 0 8px; }
    p { color: var(--muted); margin: 0 0 28px; }
    a.btn { display: inline-flex; align-items: center; gap: 8px; padding: 11px 22px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; box-shadow: 0 6px 18px -8px var(--accent); transition: transform .15s; }
    a.btn:hover { transform: translateY(-2px); }
    a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) { a.btn:hover { transform: none; } }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <div class="term">$ cd <span id="path">/this-page</span><br><b>bash: no such file or directory</b></div>
    <h1>Page not found · 页面不存在</h1>
    <p>The link may be outdated or mistyped.<br>链接可能已失效或输入有误。</p>
    <a class="btn" href="/">← Back to home · 返回首页</a>
  </main>
  <script>
    var p = location.pathname;
    document.getElementById('path').textContent = p.length > 40 ? p.slice(0, 37) + '…' : p;
  </script>
</body>
</html>
